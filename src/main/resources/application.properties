# Centralized E-Study Platform
# Cloud values are supplied by Render Environment Variables.
# Local defaults are only for development.

spring.application.name=centralized-estudy
server.port=${PORT:8080}

# Aiven MySQL (Render already has these variable names configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/estudy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep update for this incremental upgrade; back up the live DB before deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Atlas (Render environment variable)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/estudy}

# Do not expose stack traces or credentials in API responses.
server.error.include-message=never

# JWT: set JWT_SECRET in Render to a Base64-encoded secret of at least 32 bytes.
# The fallback is for local development only; replace it in production.
app.jwt.secret=${JWT_SECRET:bXktbG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- AI quiz (plain REST call to the Gemini API) ----
# Get a free key at https://aistudio.google.com. Model names change over time, so keep GEMINI_MODEL configurable.
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta

# ---- First admin account (created at startup only if ADMIN_PASSWORD is set) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
