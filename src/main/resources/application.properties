# ==========================================
# Centralized E-Study Platform - Spring Boot Configuration
# ==========================================

# ----- MySQL (User Authentication) -----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- MongoDB (Study Content) -----
# Spring Boot auto-configures MongoClient and MongoTemplate from this URL
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Server
server.port=8080
spring.application.name=centralized-estudy