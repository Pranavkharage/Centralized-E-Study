# ============================================================
# Centralized E-Study Platform - Spring Boot Configuration
# ============================================================

# ----- MySQL (User Authentication) -----
spring.datasource.url=jdbc:mysql://localhost:3306/estudy
spring.datasource.username=root
spring.datasource.password=PranavKharage
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- MongoDB (Study Content) -----
# Spring Boot auto-configures MongoClient and MongoTemplate from this URL
# Replaces: MongoClients.create("mongodb://localhost:27017") in your old code
spring.data.mongodb.uri=mongodb://localhost:27017/estudy

# Server
server.port=8080
spring.application.name=centralized-estudy
